basic:
  H: 300   
  W: 480
  seed: 1
  dataset: rml              # rml or diffuser
  downsize_coeff: 4        
  dataset_size: 0.5       # purely for logging purposes 
  use_processed: True    

loss:
  MSE_t: 1
  LPIPS_t: 0

dir:
  checkpoints_dir: './checkpoints/'   
  load_model_dir: ''                                                                        # Do not include 'latest_model.pth'. It will be automatically appended

  # MAKE SURE TO CHANGE THIS PATH DEPENDING ON WHICH DATASET YOU ARE USING. Otherwise your visualized image will diverge.
  val_pattern_dir: ''   # TODO: REPLACE with path to a validation measurement image (e.g. .../4x_rml/4x_img_64_cam_1.tiff)
  val_pattern_gt_dir: ''  # TODO: REPLACE with path to matching GT image (e.g. .../4x_undistorted_GT2RML/warped_4x_undistorted_img_64_cam_2.tiff)
  val_rec_dir: './testing/'   # where to save val reference image from above
  dataset_dir: './datasets/'

train:
  GPU_num: 2      # counterintuitive name, but this is used to calculate num workers
  load: False        
  num_steps: 450000
  eval_every: 5000 
  train_batch_size: 6

optimizer:
  optimizer: AdamW
  learning_rate: 3e-5   # TODO: changed from 6e-5
  weight_decay: 0.1

scheduler:
  use: True
  warmup_steps: 0

# Inference-only (does not change training). Requires test_patterns.npy / test_targets.npy under dir.dataset_dir.
infer:
  gpu_visible_id: "0"
  gpu_num: 0
  batch_size: 1                    # test DataLoader batch size (each sample is full RGB)
  save_ids: [1, 64, 93, 195, 912]                      # if non-empty, only save .npy for these image ids; empty => save nothing
  save_metrics: True
  save_infer_dir: "./infer_results"
  # Optional full path to checkpoint; if null, uses checkpoints_dir/<run_name>/best_model.pth
  checkpoint_path: null
  warp_to_gt: True
  # Homography .npy (GT2imager); inverted at runtime for imager -> GT 
  homography_rml: "GT2RML_homography_4x_2026_detached_numpy.npy" # TODO replace with absolute path
  homography_diffusercam: "GT2DC_homography_4x_2026_detached_numpy.npy" # TODO replace with absolute path
