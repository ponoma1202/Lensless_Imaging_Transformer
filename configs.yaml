basic:
  H: 300   
  W: 480
  seed: 1
  dataset: rml              # rml or diffuser
  downsize_coeff: 4        
  dataset_size: 0.5       # purely for logging purposes 
  use_processed: True    

loss:
  MSE_t: 1
  LPIPS_t: 0

dir:
  checkpoints_dir: '/home/ponoma/workspace/Pan_Transformer/my_checkpoints/'   
  load_model_dir: ''                                                                        # Do not include 'latest_model.pth'. It will be automatically appended

  # MAKE SURE TO CHANGE THIS PATH DEPENDING ON WHICH DATASET YOU ARE USING. Otherwise your visualized image will diverge.
  val_pattern_dir: '/home/lakabuli/4tb_patrick/dataset100k26/4x_rml/4x_img_64_cam_1.tiff'   # path to an image in val_directory to save as reference
  val_pattern_gt_dir: '/home/lakabuli/4tb_patrick/dataset100k26/4x_undistorted_GT2RML/warped_4x_undistorted_img_64_cam_2.tiff'
  val_rec_dir: '/home/ponoma/workspace/Pan_Transformer/testing/'   # where to save val reference image from above
  dataset_dir: '/home/ponoma/workspace/Pan_Transformer/datasets/'

train:
  GPU_num: 2      # counterintuitive name, but this is used to calculate num workers
  load: False        
  num_steps: 450000
  eval_every: 5000 
  train_batch_size: 6

optimizer:
  optimizer: AdamW
  learning_rate: 3e-5   # TODO: changed from 6e-5
  weight_decay: 0.1

scheduler:
  use: True
  warmup_steps: 0

# Inference-only (does not change training). Requires test_patterns.npy / test_targets.npy under dir.dataset_dir.
infer:
  gpu_visible_id: "0"
  gpu_num: 0
  batch_size: 1                    # test DataLoader batch size (each sample is full RGB)
  save_ids: [1, 64, 93, 195, 912]                      # if non-empty, only save .npy for these image ids; empty => save nothing
  save_metrics: True
  save_infer_dir: "/home/ponoma/workspace/Pan_Transformer/infer_results"
  # Optional full path to checkpoint; if null, uses checkpoints_dir/<run_name>/best_model.pth
  checkpoint_path: null
  warp_to_gt: True
  # Homography .npy (GT2imager); inverted at runtime for imager -> GT (same as your previous inference.py).
  homography_rml: "/home/ponoma/workspace/ConvRML_clean/homography_matrices/GT2RML_homography_4x_2026_detached.npy"
  homography_diffusercam: "/home/ponoma/workspace/ConvRML_clean/homography_matrices/GT2DC_homography_x4_2026_detached_May2026_FINAL.npy"
